<!DOCTYPE html>
<html>
<head>
<title>🧁ITC Café🥤</title>
<link rel="stylesheet" href="signup.css">
</head>

<body>

<header>
<h1>🧁ITC Café🍪</h1>
<p>Indulge The Coffee</p>

</header>

<main>

<section class="welcome">
    <div class="snowflakes">❄⛄🌷❄</div>
<h2>Welcome to ITC Café!</h2>
<p>Your little corner of coffee happiness</p>

<img
src="https://static.vecteezy.com/system/resources/previews/039/620/609/large_2x/ai-generated-freshly-brewed-coffee-in-a-frothy-cup-of-love-generated-by-ai-free-photo.jpg"
alt="Freshly brewed coffee"
class="coffee-art">

 
<div class="coffee-decor">

</div>
</section>

<section class="signup">
<h2>Create Your Account</h2>

<form action="/signup" method="post">

<input type="text" name="full_name"
placeholder="Full Name" required>

<input type="text" name="username"
placeholder="Username" required>

<input type="email" name="email"
placeholder="Email Address" required>

<input type="password" name="password"
placeholder="Password" required>

<input type="password" name="confirm_password"
placeholder="Confirm Password" required>

<button type="submit">Create Account</button>

</form>

<p>Already have an account?
<a href="login.html">Log In</a>
</p>
</section>

</main>

</body>
</html>
