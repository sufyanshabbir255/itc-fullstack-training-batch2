<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simmer - Find Something Delicious Tonight</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero-section {
            flex: 1;
            padding: 4rem 0;
        }

        .auth-card {
            max-width: 600px;
            margin: auto;
        }

        footer {
            background-color: #343a40;
            color: white;
            padding: 1rem;
        }

        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="./images/tomato.svg"
                     alt="Simmer"
                     width="30"
                     height="30"
                     class="me-2">
                Simmer
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="./login.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Recipes</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Categories</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">About</a>
                    </li>
                </ul>

                <a href="#" class="btn btn-primary">
                    Log In
                </a>

            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <section class="hero-section">
        <div class="container">

            <div class="text-center mb-5">
                <h1>Find Something Delicious Tonight</h1>
                <p class="text-muted">
                    Discover, save and share recipes you'll love.
                </p>
            </div>

            <div class="card shadow auth-card">
                <div class="card-body p-4">

                    <!-- Tabs -->
                    <ul class="nav nav-pills nav-fill mb-4"
                        id="authTabs"
                        role="tablist">

                        <li class="nav-item" role="presentation">
                            <button class="nav-link active"
                                    data-bs-toggle="pill"
                                    data-bs-target="#login"
                                    type="button">
                                Login
                            </button>
                        </li>

                        <li class="nav-item" role="presentation">
                            <button class="nav-link"
                                    data-bs-toggle="pill"
                                    data-bs-target="#register"
                                    type="button">
                                Register
                            </button>
                        </li>

                    </ul>

                    <div class="tab-content">

                        <!-- Login -->
                        <div class="tab-pane fade show active"
                             id="login">
                            
                            <form>

                                <div class="mb-3">
                                    <label for="loginEmail"
                                           class="form-label">
                                        Email
                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           id="loginEmail">
                                </div>

                                <div class="mb-3">
                                    <label for="loginPassword"
                                           class="form-label">
                                        Password
                                    </label>

                                    <input type="password"
                                           class="form-control"
                                           id="loginPassword">
                                </div>

                                <div class="d-flex justify-content-between mb-4">

                                    <div class="form-check">
                                        <input class="form-check-input"
                                               type="checkbox"
                                               id="rememberMe">

                                        <label class="form-check-label"
                                               for="rememberMe">
                                            Remember me
                                        </label>
                                    </div>

                                    <a href="#">
                                        Forgot password?
                                    </a>

                                </div>

                                <button type="submit"
                                        class="btn btn-primary w-100">
                                    Sign In
                                </button>

                            </form>

                        </div>

                        <!-- Register -->
                        <div class="tab-pane fade"
                             id="register">

                            <form>

                                <div class="mb-3">
                                    <label for="registerName"
                                           class="form-label">
                                        Full Name
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="registerName">
                                </div>

                                <div class="mb-3">
                                    <label for="registerEmail"
                                           class="form-label">
                                        Email
                                    </label>

                                    <input type="email"
                                           class="form-control"
                                           id="registerEmail">
                                </div>

                                <div class="mb-3">
                                    <label for="registerPassword"
                                           class="form-label">
                                        Password
                                    </label>

                                    <input type="password"
                                           class="form-control"
                                           id="registerPassword">
                                </div>

                                <div class="mb-3">
                                    <label for="registerConfirmPassword"
                                           class="form-label">
                                        Confirm Password
                                    </label>

                                    <input type="password"
                                           class="form-control"
                                           id="registerConfirmPassword">
                                </div>

                                <button type="submit"
                                        class="btn btn-success w-100">
                                    Create Account
                                </button>

                            </form>

                        </div>

                    </div>

                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="text-center">
        <img src="./images/tomato.svg"
             alt="Simmer"
             width="18"
             height="18">

        Simmer
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/auth.js"></script>
    <script>
    function login(email, password, users) {

    const user = users.find(
        user =>
            user.email === email &&
            user.password === password
    );

    return !!user;
}</script>
</body>
</html>
