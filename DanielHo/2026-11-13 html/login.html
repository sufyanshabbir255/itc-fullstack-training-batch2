<!DOCTYPE html>
<html>

<head>
    <title>Simmer Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1>Simmer</h1>

    <!-- Login -->

    <form id="loginForm">

        <h3>Login</h3>

        <input
            id="loginEmail"
            class="form-control mb-2"
            placeholder="Email">

        <input
            id="loginPassword"
            type="password"
            class="form-control mb-2"
            placeholder="Password">

        <button
            type="submit"
            class="btn btn-primary">
            Login
        </button>

    </form>

    <div id="loginMessage" class="mt-3"></div>

    <hr>

    <!-- Register -->

    <form id="registerForm">

        <h3>Register</h3>

        <input
            id="registerEmail"
            class="form-control mb-2"
            placeholder="Email">

        <input
            id="registerPassword"
            type="password"
            class="form-control mb-2"
            placeholder="Password">

        <input
            id="confirmPassword"
            type="password"
            class="form-control mb-2"
            placeholder="Confirm Password">

        <button
            type="submit"
            class="btn btn-success">
            Register
        </button>

    </form>

    <div id="registerMessage" class="mt-3"></div>

</div>

<script src="./auth.js"></script>

</body>

</html>
