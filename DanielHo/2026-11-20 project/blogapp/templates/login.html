<!DOCTYPE html>
<html>
<body>

<h1>Login</h1>

<input
    id="email"
    type="email"
    placeholder="Email"
>

<input
    id="password"
    type="password"
    placeholder="Password"
>

<button onclick="login()">
    Login
</button>

<script>

async function login() {

    const response = await fetch(
        "/api/login",
        {
            method: "POST",

            headers: {
                "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
                email:
                    document.getElementById(
                        "email"
                    ).value,

                password:
                    document.getElementById(
                        "password"
                    ).value
            })
        }
    )

    const data =
        await response.json()

    console.log(data)

}

</script>

</body>
</html>
