<input id="title">

<textarea id="content"></textarea>

<button onclick="savePost()">
    Save
</button>

<script>

async function savePost() {

    const response = await fetch(
        "/api/posts",
        {
            method: "POST",

            headers: {
                "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
                title:
                    document.getElementById(
                        "title"
                    ).value,

                content:
                    document.getElementById(
                        "content"
                    ).value,

                user_id: 1
            })
        }
    )

    const result =
        await response.json()

    console.log(result)

}

</script>
