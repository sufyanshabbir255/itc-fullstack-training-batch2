<!DOCTYPE html>
<!-- Tells the browser this is a modern HTML5 page -->
<html lang="en">

<!-- ===================== HEAD =====================
     Settings and styles. Nothing in here shows on the page itself. -->
<head>
  <!-- Character set: lets the page show emojis and symbols like — correctly -->
  <meta charset="UTF-8">
  <!-- Makes the page scale properly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Text shown on the browser tab -->
  <title>Simmer - Recipe Finder</title>
  <!-- Downloads two free Google fonts: Poppins (headings) and Inter (normal text) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- ===================== CSS (the design rules) =====================
       Format:  selector { property: value; }
       - a word on its own (body, h1, nav) = styles that HTML tag
       - a dot in front (.logo, .chip)     = styles anything with that class="..."
       - two names with a space (nav a)    = an "a" that sits inside a "nav" -->
        
<link rel="stylesheet" href="style.css">
</head>

<!-- ===================== BODY =====================
     Everything inside body is what the visitor sees. -->
<body>

  <!-- ---------- Header (top bar) ---------- -->
  <header>
    <!-- Logo. href="#" = a link that goes nowhere for now -->
    <a href="#" class="logo">🍅 Simmer</a>

    <!-- nav = the menu -->
    <nav>
      <!-- class="active" marks the page we're on -->
      <a href="#" class="active">Home</a>
      <a href="#">Recipes</a>
      <a href="#">Categories</a>
      <a href="#">About</a>
      <!-- class="btn" makes this link look like a green button -->
      <a href="#" class="btn">Surprise me</a>
    </nav>
  </header>

  <!-- ---------- Middle section ---------- -->
  <section class="middle">

    <!-- Orange badge. span = a small inline piece of text -->
    <span class="badge">🔥 1000+ recipes, zero login</span>

    <!-- h1 = the main heading of the page (only one per page) -->
    <h1>Find something delicious tonight.</h1>

    <!-- p = a paragraph of text -->
    <p class="subtitle">Search thousands of recipes from around the world. Type an ingredient or a dish — we'll do the rest.</p>

    <!-- Search box. form = a group of input controls -->
    <form class="search">
      <!-- Magnifying glass emoji -->
      <span>🔎</span>
      <!-- Text box. placeholder = grey hint text that disappears when you type -->
      <input type="text" placeholder="Search recipes...  e.g. chicken, pasta, beef">
      <!-- type="submit" = clicking it sends the form -->
      <button type="submit" class="btn">Search</button>
    </form>

    <!-- "Popular:" label followed by five chips. div = a plain box to group things -->
    <div class="popular">
      <span>Popular:</span>
      <a href="#" class="chip">Chicken</a>
      <a href="#" class="chip">Pasta</a>
      <a href="#" class="chip">Dessert</a>
      <a href="#" class="chip">Seafood</a>
      <a href="#" class="chip">Vegetarian</a>
    </div>

  </section>

</body>
<script src="script.js"></script>
</html>
