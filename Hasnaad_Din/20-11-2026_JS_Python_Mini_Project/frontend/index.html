<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <div class="card">
    <h1>Login</h1>
    <form id="login-form">
      <input id="username" placeholder="Username or email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p class="or">or</p>

    <!-- Google draws its own button inside these two divs -->
    <div id="g_id_onload"
         data-client_id="667974997716-9trju2m2pqbeqecqajntmmob35alqu6n.apps.googleusercontent.com"
         data-callback="handleGoogleLogin">
    </div>
    <div class="g_id_signin"></div>

    <p id="message"></p>
    <p>No account? <a href="signup.html">Sign up</a></p>
  </div>
  <script src="login.js"></script>
</body>
</html>
